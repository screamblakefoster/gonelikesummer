<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>gone like summer — Private</title>

  <link rel="icon" href="favicon.ico">

  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1a1a1a;
      --muted: #767267;
      --card-bg: #eae6dc;
      --line: #e2ddd0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-weight: 400;
    }

    a { color: inherit; text-decoration: none; }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 30px 50px;
      text-align: center;
    }

    .site-title {
      font-size: 44px;
      letter-spacing: 0.01em;
      margin: 0;
      font-weight: 400;
    }

    .site-title a {
      display: inline-block;
    }

    .logo-img {
      height: 90px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      font-size: 18px;
      line-height: 1;
      margin-top: 26px;
    }

    nav a {
      color: var(--fg);
      opacity: 0.55;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    @media (max-width: 900px) {
      header {
        padding: 50px 20px 40px;
      }
      .site-title {
        font-size: 36px;
      }
      .logo-img {
        height: 72px;
      }
      nav {
        gap: 24px;
        font-size: 16px;
      }
    }

    @media (max-width: 650px) {
      header {
        padding: 40px 18px 30px;
      }
      .site-title {
        font-size: 30px;
      }
      .logo-img {
        height: 60px;
      }
      nav {
        gap: 16px;
        flex-wrap: wrap;
        font-size: 15px;
      }
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .strips-wrap {
      display: none;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .strip-block {
      margin-bottom: 14px;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .strip-block:last-child {
      margin-bottom: 0;
    }

    .strip-block.from-left {
      transform: translateX(-90px);
    }

    .strip-block.from-right {
      transform: translateX(90px);
    }

    .strip-block.in {
      opacity: 1;
      transform: translateX(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .strip-block {
        transition: none;
        opacity: 1;
        transform: none;
      }
    }

    .strip-frame {
      width: 100%;
      aspect-ratio: 1.91 / 1;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .strip-frame::-webkit-scrollbar {
      display: none;
    }

    .strip-frame.dragging {
      cursor: grabbing;
    }

    .strip-frame img {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 400%;
      height: auto;
      display: block;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       ENTRY / PASSWORD
       ========================= */

    .entry {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 30px;
      text-align: center;
    }

    .entry-top {
      padding-top: 10px;
      padding-bottom: 50px;
    }

    .scroll-hint {
      display: none;
      text-align: center;
      color: var(--muted);
      font-style: italic;
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }

    .entry-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #entry-input {
      width: 100%;
      max-width: 280px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--fg);
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 20px;
      text-align: center;
      color: var(--fg);
      padding: 8px 0;
      letter-spacing: 0.08em;
    }

    #entry-input:focus {
      outline: none;
    }

    #entry-submit {
      background: none;
      border: none;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
      color: var(--fg);
      cursor: pointer;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }

    #entry-submit:hover {
      opacity: 0.6;
    }

    .entry-error {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
      height: 16px;
      margin-top: -4px;
    }

    footer {
      padding: 40px 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 650px) {
      main {
        padding: 0 18px;
      }
      .strips-wrap {
        padding: 0 18px 30px;
      }
      .strip-block {
        margin-bottom: 10px;
      }
      .entry {
        padding: 16px 20px;
      }
      .entry-top {
        padding-top: 50px;
        padding-bottom: 36px;
      }
    }

    @media (min-width: 651px) {
      .strip-frame {
        width: 82vw;
        max-width: 1100px;
        margin: 0 auto;
        aspect-ratio: 5.73 / 1;
      }

      .strip-frame img {
        width: 133.33%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="site-title"><a href="index.html"><img class="logo-img" src="logo.png" alt="gone like summer"></a></h1>

    <nav aria-label="Main navigation">
      <a href="music.html">music</a>
      <a href="shows.html">shows</a>
      <a href="about.html">about</a>
      <a href="videos.html">videos</a>
      <a class="active" href="panda.html" aria-current="page">panda</a>
      <a href="https://wun6e0-uf.myshopify.com">shop</a>
    </nav>
  </header>

  <main>

    <div class="entry entry-top">
      <form class="entry-form" id="entry-form" autocomplete="off">
        <input type="text" id="entry-input" placeholder="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="entry-error" id="entry-error"></div>
        <button type="submit" id="entry-submit">ENTER</button>
      </form>
    </div>

    <div class="scroll-hint">⟵ scroll ⟶</div>

  </main>

  <div class="strips-wrap">

    <div class="strip-block from-left">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-1.jpg" alt="Panda cam strip 1">
      </div>
    </div>

    <div class="strip-block from-right">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-2.jpg" alt="Panda cam strip 2">
      </div>
    </div>

    <div class="strip-block from-left">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-3.jpg" alt="Panda cam strip 3">
      </div>
    </div>

    <div class="strip-block from-right">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-4.jpg" alt="Panda cam strip 4">
      </div>
    </div>

  </div>

  <script>
    const PASSWORD = "glspandacam";

    const form = document.getElementById("entry-form");
    const input = document.getElementById("entry-input");
    const error = document.getElementById("entry-error");
    const entryTop = document.querySelector(".entry-top");
    const scrollHint = document.querySelector(".scroll-hint");
    const stripsWrap = document.querySelector(".strips-wrap");

    function revealStrips() {
      entryTop.style.display = "none";
      scrollHint.style.display = "block";
      stripsWrap.style.display = "block";

      const strips = document.querySelectorAll(".strip-block");
      strips.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add("in");
        }, 100 + i * 220);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value.trim().toLowerCase() === PASSWORD) {
        revealStrips();
      } else {
        error.textContent = "wrong password";
        input.value = "";
        input.focus();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      // Wheel scroll (vertical wheel/trackpad input slides the strip horizontally)
      const frames = document.querySelectorAll(".strip-frame");
      frames.forEach((frame) => {
        frame.addEventListener(
          "wheel",
          (e) => {
            // Only hijack a gesture that's already predominantly horizontal
            // (shift+scroll, a trackpad's horizontal swipe). A vertical-dominant
            // scroll passes through untouched so the page can scroll normally.
            if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
            frame.scrollLeft += e.deltaX;
            e.preventDefault();
          },
          { passive: false }
        );

        // Click-and-drag scroll
        let isDown = false;
        let startX = 0;
        let startScroll = 0;

        frame.addEventListener("mousedown", (e) => {
          isDown = true;
          frame.classList.add("dragging");
          startX = e.pageX;
          startScroll = frame.scrollLeft;
        });

        window.addEventListener("mouseup", () => {
          isDown = false;
          frame.classList.remove("dragging");
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const dx = e.pageX - startX;
          frame.scrollLeft = startScroll - dx;
        });
      });
    });
  </script>

</body>
</html>
