<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>gone like summer — Private</title>

  <link rel="icon" href="favicon.ico">

  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1a1a1a;
      --muted: #767267;
      --card-bg: #eae6dc;
      --line: #e2ddd0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-weight: 400;
    }

    a { color: inherit; text-decoration: none; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 30px 40px;
    }

    .strip-block {
      margin-bottom: 14px;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .strip-block:last-child {
      margin-bottom: 0;
    }

    .strip-block.from-left {
      transform: translateX(-90px);
    }

    .strip-block.from-right {
      transform: translateX(90px);
    }

    .strip-block.in {
      opacity: 1;
      transform: translateX(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .strip-block {
        transition: none;
        opacity: 1;
        transform: none;
      }
    }

    .strip-frame {
      width: 100%;
    }

    .strip-frame img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       ENTRY / PASSWORD
       ========================= */

    .entry {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 30px;
      text-align: center;
    }

    .entry-top {
      padding-top: 70px;
      padding-bottom: 50px;
    }

    .entry-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #entry-input {
      width: 100%;
      max-width: 280px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--fg);
      font-family: "Times New Roman", Times, serif;
      font-size: 20px;
      text-align: center;
      color: var(--fg);
      padding: 8px 0;
      letter-spacing: 0.08em;
    }

    #entry-input:focus {
      outline: none;
    }

    #entry-submit {
      background: none;
      border: none;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-style: italic;
      color: var(--fg);
      cursor: pointer;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }

    #entry-submit:hover {
      opacity: 0.6;
    }

    .entry-error {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
      height: 16px;
      margin-top: -4px;
    }

    footer {
      padding: 40px 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 650px) {
      main {
        padding: 0 18px 30px;
      }
      .strip-block {
        margin-bottom: 10px;
      }
      .entry {
        padding: 16px 20px;
      }
      .entry-top {
        padding-top: 50px;
        padding-bottom: 36px;
      }
    }
  </style>
</head>
<body>

  <main>

    <div class="entry entry-top">
      <form class="entry-form" id="entry-form" autocomplete="off">
        <input type="password" id="entry-input" placeholder="password">
        <div class="entry-error" id="entry-error"></div>
        <button type="submit" id="entry-submit">ENTER</button>
      </form>
    </div>

    <div class="strip-block from-left">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-1.jpg" alt="Panda cam strip 1">
      </div>
    </div>

    <div class="strip-block from-right">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-2.jpg" alt="Panda cam strip 2">
      </div>
    </div>

    <div class="strip-block from-left">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-3.jpg" alt="Panda cam strip 3">
      </div>
    </div>

    <div class="strip-block from-right">
      <div class="strip-frame">
        <img src="photostrips/panda-strip-4.jpg" alt="Panda cam strip 4">
      </div>
    </div>

  </main>

  <script>
    const PASSWORD = "glspandacam";

    const form = document.getElementById("entry-form");
    const input = document.getElementById("entry-input");
    const error = document.getElementById("entry-error");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value.trim().toLowerCase() === PASSWORD) {
        window.location.href = "index.html";
      } else {
        error.textContent = "wrong password";
        input.value = "";
        input.focus();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      const strips = document.querySelectorAll(".strip-block");
      strips.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add("in");
        }, 300 + i * 220);
      });
    });
  </script>

</body>
</html>
