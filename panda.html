    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 30px 50px;
      text-align: center;
    }

    .site-title {
      font-size: 44px;
      letter-spacing: 0.01em;
      margin: 0;
      font-weight: 400;
    }

    .site-title a {
      display: inline-block;
    }

    .logo-img {
      height: 90px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      font-size: 18px;
      line-height: 1;
      margin-top: 26px;
    }

    nav a {
      color: var(--fg);
      opacity: 0.55;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    @media (max-width: 900px) {
      header {
        padding: 50px 20px 40px;
      }
      .site-title {
        font-size: 36px;
      }
      .logo-img {
        height: 72px;
      }
      nav {
        gap: 24px;
        font-size: 16px;
      }
    }

    @media (max-width: 650px) {
      header {
        padding: 40px 18px 30px;
      }
      .site-title {
        font-size: 30px;
      }
      .logo-img {
        height: 60px;
      }
      nav {
        gap: 16px;
        flex-wrap: wrap;
        font-size: 15px;
      }
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .strips-wrap {
      display: none;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .strip-block {
      margin-bottom: 14px;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .strip-block:last-child {
      margin-bottom: 0;
    }

    .strip-block.from-left {
      transform: translateX(-90px);
    }

    .strip-block.from-right {
      transform: translateX(90px);
    }

    .strip-block.in {
      opacity: 1;
      transform: translateX(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .strip-block {
        transition: none;
        opacity: 1;
        transform: none;
      }
    }

    .strip-frame {
      width: 100%;
      aspect-ratio: 1.91 / 1;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .strip-frame::-webkit-scrollbar {
      display: none;
    }

    .strip-frame.dragging {
      cursor: grabbing;
    }

    .strip-frame img {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 400%;
      height: auto;
      display: block;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       ENTRY / PASSWORD
       ========================= */

    .entry {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 30px;
      text-align: center;
    }

    .entry-top {
      padding-top: 10px;
      padding-bottom: 50px;
    }

    .scroll-hint {
      display: none;
      text-align: center;
      color: var(--muted);
      font-style: italic;
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }

    .entry-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #entry-input {
      width: 100%;
      max-width: 280px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--fg);
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 20px;
      text-align: center;
      color: var(--fg);
      padding: 8px 0;
      letter-spacing: 0.08em;
    }

    #entry-input:focus {
      outline: none;
    }

    /* =========================
       FOCUS VIEW (photostrip lightbox)
       ========================= */

    .focus-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(20, 18, 14, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .focus-overlay.open {
      display: flex;
      opacity: 1;
    }

    .focus-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 640px;
      width: 100%;
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.35s ease;
    }

    .focus-overlay.open .focus-card {
      transform: scale(1);
      opacity: 1;
    }

    .focus-hint {
      color: #d8d3c6;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0.85;
      animation: focus-hint-pulse 2.6s ease-in-out infinite;
    }

    @keyframes focus-hint-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }

    .focus-stage {
      position: relative;
      width: 100%;
    }

    .focus-row {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .focus-frame {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      aspect-ratio: 55 / 36;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      background: #000;
      border-radius: 2px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .focus-frame::-webkit-scrollbar {
      display: none;
    }

    .focus-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 500% 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .focus-nav {
      flex: 0 0 auto;
      background: rgba(20, 18, 14, 0.45);
      color: #f7f5f0;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-family: "Times New Roman", Times, serif;
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .focus-nav:hover {
        background: rgba(20, 18, 14, 0.7);
      }
    }

    .focus-nav:disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .focus-close {
      position: absolute;
      top: 22px;
      right: 24px;
      background: rgba(20, 18, 14, 0.45);
      color: #f7f5f0;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .focus-close:hover {
        background: rgba(20, 18, 14, 0.7);
      }
    }

    .focus-dots {
      display: flex;
      gap: 8px;
    }

    .focus-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d8d3c6;
      opacity: 0.4;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .focus-dot.active {
      opacity: 1;
      transform: scale(1.3);
    }

    .focus-caption {
      color: #efece3;
      font-style: italic;
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
      max-width: 540px;
    }

    .focus-caption.empty {
      display: none;
    }

    @media (max-width: 650px) {
      .focus-overlay {
        padding: 16px;
      }
      .focus-card {
        max-width: 460px;
      }
      .focus-row {
        gap: 8px;
      }
      .focus-nav {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
      .focus-close {
        top: 14px;
        right: 14px;
        width: 32px;
        height: 32px;
        font-size: 14px;
      }
      .focus-caption {
        font-size: 14px;
      }
    }

    @media (min-width: 900px) {
      .focus-card {
        max-width: 760px;
      }
      .focus-caption {
        max-width: 620px;
        font-size: 17px;
      }
    }
  </style>

  <div class="focus-overlay" id="focus-overlay" role="dialog" aria-modal="true" aria-label="Photostrip viewer">
    <button class="focus-close" id="focus-close" aria-label="Close">✕</button>
    <div class="focus-card">
      <div class="focus-hint">⟵ swipe to see the rest of the strip ⟶</div>
      <div class="focus-stage">
        <div class="focus-row">
          <button class="focus-nav prev" id="focus-prev" aria-label="Previous photo">‹</button>
          <div class="focus-frame" id="focus-frame">
            <div class="focus-slide" id="focus-slide-0"></div>
            <div class="focus-slide" id="focus-slide-1"></div>
            <div class="focus-slide" id="focus-slide-2"></div>
            <div class="focus-slide" id="focus-slide-3"></div>
            <div class="focus-slide" id="focus-slide-4"></div>
          </div>
          <button class="focus-nav next" id="focus-next" aria-label="Next photo">›</button>
        </div>
      </div>
      <div class="focus-dots" id="focus-dots"></div>
      <p class="focus-caption" id="focus-caption"></p>
      <span class="sr-only" id="focus-status" aria-live="polite"></span>
    </div>
  </div>

  <script>
    const VALID_PASSWORDS = ["heavenisfalling", "heaven is falling"];

    // Strip captions — keyed by strip number (matches panda-strip-N.jpg).
    // Add more lines here as descriptions come in; strips without an entry
    // just show no caption.
    const STRIP_DESCRIPTIONS = {
      1: "this is a placeholder caption from blake and claude lol",
      2: "we just got to nyc for our first sessions of the album. we were still kinda unsure of the exact sound we wanted, but we knew the direction. not sure what the first photo is — here's me and will, and john's hand (i think he was finding the brightness), then us walking around brooklyn. kenny in studio, day one!! (i think we wrote strings this day)",
      3: "woah, back to the premiere. blake came out on a whim — legend. here's us walking around times square. inception. john and i sharing a full size in manhattan, too small! kenny writing what i think was desires in the studio!!",
      4: "we wanted to go for a walk and ended up in washington square park, where the birds are plenty and the squirrels are fat. here's thomas laying down the acoustic guitar for strings!",
      5: "first night in nyc. we're starting to plot the concept of the album. some plants in the studio! moooooog. john writing on the back of a poster, which we used religiously to tell the tale of the man throughout the album.",
      6: "john taking pictures of himself before he went on a walk, which he did frequently on this trip. he took a nice photo of me walking. i believe this is riley in front of the door in the studio. also, our 'gasp' cover art. trinkets!!",
      7: "a list of ideas and statements we lived by for the album. the acoustic guitar that wrote gasp, strings, and other beautiful elements on the album. perry mason pulled up! casey shoes in the flesh, writing words for the album. john's head, captured.",
      8: "someone took a photo of me lounging, heavyyy. hey look, it's riley! iggy recording us in the studio! john is gearing up to go in the booth to record. kenny's computer working on the album in session.",
      9: "this is the concept board for the album — maybe it's the task list, so we didn't lose track of everything we were doing. it was such a process, but a beautiful journey! honestly, don't know what these other ones are — i think we went to a japanese restaurant and had incredible food.",
      10: "kenny, john, and iggy going through the board to see what is goooood. slide studios! kenny playing with the compression on john's vocal recordings. the desk at the studio. conceptual ideas for the album's journey.",
    };

    const FRAMES_PER_STRIP = 5;

    const form = document.getElementById("entry-form");
    const input = document.getElementById("entry-input");
    const error = document.getElementById("entry-error");
    const entryTop = document.querySelector(".entry-top");
    const scrollHint = document.querySelector(".scroll-hint");
    const stripsWrap = document.querySelector(".strips-wrap");

    function revealStrips() {
      entryTop.style.display = "none";
      scrollHint.style.display = "block";
      stripsWrap.style.display = "block";

      const strips = document.querySelectorAll(".strip-block");
      strips.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add("in");
        }, 50 + i * 110);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (VALID_PASSWORDS.includes(input.value.trim().toLowerCase())) {
        revealStrips();
      } else {
        error.textContent = "wrong password";
        input.value = "";
        input.focus();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      // Wheel scroll (vertical wheel/trackpad input slides the strip horizontally)
      const frames = document.querySelectorAll(".strip-frame");
      frames.forEach((frame, stripIndex) => {
        frame.addEventListener(
          "wheel",
          (e) => {
            // Only hijack a gesture that's already predominantly horizontal
            // (shift+scroll, a trackpad's horizontal swipe). A vertical-dominant
            // scroll passes through untouched so the page can scroll normally.
            if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
            frame.scrollLeft += e.deltaX;
            e.preventDefault();
          },
          { passive: false }
        );

        // Click-and-drag scroll (also doubles as the click-to-open gesture:
        // a mouseup with negligible movement counts as a click, not a drag).
        let isDown = false;
        let startX = 0;
        let startScroll = 0;
        let moved = 0;

        frame.addEventListener("mousedown", (e) => {
          isDown = true;
          moved = 0;
          frame.classList.add("dragging");
          startX = e.pageX;
          startScroll = frame.scrollLeft;
        });

        window.addEventListener("mouseup", (e) => {
          if (!isDown) return;
          isDown = false;
          frame.classList.remove("dragging");
          if (moved < 6 && e.target.closest(".strip-frame") === frame) {
            openFocus(stripIndex);
          }
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const dx = e.pageX - startX;
          moved = Math.max(moved, Math.abs(dx));
          frame.scrollLeft = startScroll - dx;
        });

        // Touch: a tap that didn't scroll the strip opens the focus view.
        let touchStartX = 0;
        let touchStartScroll = 0;
        let touchMoved = 0;

        frame.addEventListener(
          "touchstart",
          (e) => {
            const t = e.touches[0];
            touchStartX = t.pageX;
            touchStartScroll = frame.scrollLeft;
            touchMoved = 0;
          },
          { passive: true }
        );

        frame.addEventListener(
          "touchmove",
          (e) => {
            const t = e.touches[0];
            touchMoved = Math.max(touchMoved, Math.abs(t.pageX - touchStartX));
          },
          { passive: true }
        );

        frame.addEventListener("touchend", () => {
          if (touchMoved < 6) openFocus(stripIndex);
        });
      });
    });

    // =========================
    // FOCUS VIEW
    // =========================

    const overlay = document.getElementById("focus-overlay");
    const focusFrame = document.getElementById("focus-frame");
    const focusSlides = [...document.querySelectorAll(".focus-slide")];
    const focusCaption = document.getElementById("focus-caption");
    const focusDots = document.getElementById("focus-dots");
    const focusPrev = document.getElementById("focus-prev");
    const focusNext = document.getElementById("focus-next");
    const focusClose = document.getElementById("focus-close");
    const focusStatus = document.getElementById("focus-status");

    let currentStrip = 0;
    let currentFrame = 0;
    let lastFocusedFrame = null;

    function stripSrc(stripIndex) {
      return `photostrips/panda-strip-${stripIndex + 1}.jpg`;
    }

    // Each slide shows one frame via a shared background image: the image
    // is 500% of the slide's width (5 frames), and background-position-x
    // steps from 0% to 100% in equal increments to reveal each frame in
    // turn — the standard CSS sprite-sheet technique.
    focusSlides.forEach((slide, i) => {
      slide.style.backgroundPositionX = `${(i / (FRAMES_PER_STRIP - 1)) * 100}%`;
    });

    function updateChrome() {
      [...focusDots.children].forEach((dot, i) => {
        dot.classList.toggle("active", i === currentFrame);
      });
      focusPrev.disabled = currentFrame === 0;
      focusNext.disabled = currentFrame === FRAMES_PER_STRIP - 1;
      focusStatus.textContent = `Photo ${currentFrame + 1} of ${FRAMES_PER_STRIP}`;
    }

    function openFocus(stripIndex) {
      currentStrip = stripIndex;
      currentFrame = 0;
      lastFocusedFrame = document.activeElement;

      const stripNumber = stripIndex + 1;
      const src = stripSrc(stripIndex);
      focusSlides.forEach((slide) => {
        slide.style.backgroundImage = `url(${src})`;
      });

      const caption = STRIP_DESCRIPTIONS[stripNumber] || "";
      focusCaption.textContent = caption;
      focusCaption.classList.toggle("empty", !caption);

      focusDots.innerHTML = "";
      for (let i = 0; i < FRAMES_PER_STRIP; i++) {
        const dot = document.createElement("span");
        dot.className = "focus-dot";
        focusDots.appendChild(dot);
      }

      focusFrame.scrollLeft = 0;
      updateChrome();
      overlay.classList.add("open");
      lockBodyScroll();
      focusClose.focus();
    }

    function closeFocus() {
      overlay.classList.remove("open");
      unlockBodyScroll();
      if (lastFocusedFrame) lastFocusedFrame.focus();
    }

    // overflow:hidden on body alone doesn't reliably stop background
    // scroll on iOS Safari when a finger drags over the backdrop, so the
    // body is pinned in place with position:fixed while the focus view
    // is open and restored to its exact scroll position on close.
    let savedScrollY = 0;

    function lockBodyScroll() {
      savedScrollY = window.scrollY;
      document.body.style.position = "fixed";
      document.body.style.top = `-${savedScrollY}px`;
      document.body.style.left = "0";
      document.body.style.right = "0";
    }

    function unlockBodyScroll() {
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      window.scrollTo(0, savedScrollY);
    }

    function stepFrame(delta) {
      const next = currentFrame + delta;
      if (next < 0 || next >= FRAMES_PER_STRIP) return;
      currentFrame = next;
      focusFrame.scrollTo({ left: currentFrame * focusFrame.clientWidth, behavior: "smooth" });
      updateChrome();
    }

    focusPrev.addEventListener("click", () => stepFrame(-1));
    focusNext.addEventListener("click", () => stepFrame(1));
    focusClose.addEventListener("click", closeFocus);

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeFocus();
    });

    window.addEventListener("keydown", (e) => {
      if (!overlay.classList.contains("open")) return;
      if (e.key === "Escape") closeFocus();
      if (e.key === "ArrowLeft") stepFrame(-1);
      if (e.key === "ArrowRight") stepFrame(1);
    });

    // Trackpad/touch paging through the strip's photos is now handled by
    // real native scrolling (the .focus-frame is an actual horizontally
    // scrollable, scroll-snap element — see CSS). That's deliberate: every
    // attempt to interpret raw wheel deltas ourselves (a distance
    // threshold, a cooldown, a settle debounce) depends on guessing a
    // given trackpad's delta sizes and momentum timing, which vary enough
    // across hardware that each guess just traded one bug for another
    // (double-step, then stuck, then a multi-second delay). The browser's
    // own scroll + snap implementation already handles "let momentum run,
    // then settle on the nearest point" correctly across devices, so we
    // let it do that instead of reinventing it. overscroll-behavior-x on
    // the frame (see CSS) stops an overscroll at the first/last photo from
    // triggering the browser's back/forward page-navigation gesture.
    //
    // All we do here is listen for native scrolling to settle and sync
    // our own state (dots, arrow disabled state, status text) to wherever
    // it landed.
    let scrollSettleTimer = null;

    focusFrame.addEventListener("scroll", () => {
      clearTimeout(scrollSettleTimer);
      scrollSettleTimer = setTimeout(() => {
        const idx = Math.round(focusFrame.scrollLeft / focusFrame.clientWidth);
        currentFrame = Math.max(0, Math.min(FRAMES_PER_STRIP - 1, idx));
        updateChrome();
      }, 120);
    });

    // Belt-and-suspenders: iOS Safari can still let a stray drag scroll
    // the page behind a fixed overlay, even with the body pinned via
    // lockBodyScroll(). Block touchmove everywhere over the modal EXCEPT
    // inside .focus-frame, which needs real touchmove to scroll natively.
    overlay.addEventListener(
      "touchmove",
      (e) => {
        if (!overlay.classList.contains("open")) return;
        if (e.target.closest(".focus-frame")) return;
        e.preventDefault();
      },
      { passive: false }
    );
  </script>
