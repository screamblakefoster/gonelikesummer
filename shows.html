<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gone like summer — Shows</title>

  <style>

    :root {
      --bg: #f7f5f0;
      --fg: #1a1a1a;
      --muted: #767267;
      --card-bg: #eae6dc;
      --line: #e2ddd0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 30px 50px;
      text-align: center;
    }

    .site-title {
      font-size: 44px;
      letter-spacing: 0.01em;
      margin: 0;
      font-weight: 400;
    }

    .site-subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-top: 10px;
      font-style: italic;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      font-size: 18px;
      line-height: 1;
      margin-top: 26px;
    }

    nav a {
      color: var(--fg);
      opacity: 0.55;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    footer {
      padding: 40px 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      border-top: 1px solid var(--line);
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      header {
        padding: 50px 20px 40px;
      }
      .site-title {
        font-size: 36px;
      }
      nav {
        gap: 24px;
        font-size: 16px;
      }
    }

    @media (max-width: 650px) {
      header {
        padding: 40px 18px 30px;
      }
      .site-title {
        font-size: 30px;
      }
      nav {
        gap: 16px;
        flex-wrap: wrap;
        font-size: 15px;
      }
    }


    main {
      width: 100%;
      padding: 0 30px 120px;
    }

    .shows {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 20px;
      font-style: italic;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    @media (max-width: 650px) {
      main {
        padding: 0 18px 90px;
      }
      .empty-state {
        padding: 60px 16px;
        font-size: 17px;
      }
    }

  </style>
</head>
<body>

  <header>
    <h1 class="site-title">gone like summer</h1>

    <nav aria-label="Main navigation">
      <a href="music.html">music</a>
      <a class="active" href="shows.html" aria-current="page">shows</a>
      <a href="about.html">about</a>
      <a href="videos.html">videos</a>
      <a href="shop.html">shop</a>
    </nav>
  </header>

  <main>
    <section class="shows">
      <div class="empty-state">
        No shows announced yet — check back soon.
      </div>
    </section>
  </main>

  <footer>
    © 2026 gone like summer
  </footer>

</body>
</html>
