<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gone like summer — Shows</title>

  <link rel="icon" href="favicon.ico">

  <style>

    :root {
      --bg: #f7f5f0;
      --fg: #1a1a1a;
      --muted: #767267;
      --card-bg: #eae6dc;
      --line: #e2ddd0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 30px 50px;
      text-align: center;
    }

    .site-title {
      font-size: 44px;
      letter-spacing: 0.01em;
      margin: 0;
      font-weight: 400;
    }

    .site-title a {
      display: inline-block;
    }

    .logo-img {
      height: 90px;
      width: auto;
      display: block;
    }

    .site-subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-top: 10px;
      font-style: italic;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      font-size: 18px;
      line-height: 1;
      margin-top: 26px;
    }

    nav a {
      color: var(--fg);
      opacity: 0.55;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    footer {
      padding: 40px 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      border-top: 1px solid var(--line);
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      header {
        padding: 50px 20px 40px;
      }
      .site-title {
        font-size: 36px;
      }
      .logo-img {
        height: 72px;
      }
      nav {
        gap: 24px;
        font-size: 16px;
      }
    }

    @media (max-width: 650px) {
      header {
        padding: 40px 18px 30px;
      }
      .site-title {
        font-size: 30px;
      }
      .logo-img {
        height: 60px;
      }
      nav {
        gap: 16px;
        flex-wrap: wrap;
        font-size: 15px;
      }
    }


    main {
      width: 100%;
      padding: 0 30px 120px;
    }

    .shows {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .show-tabs {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      font-size: 16px;
      line-height: 1;
    }

    .show-tab {
      color: var(--muted);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .show-tab:hover {
      opacity: 0.6;
    }

    .show-tab.active {
      color: var(--fg);
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }

    .show-tab-divider {
      color: var(--line);
    }

    .show-card {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      align-items: center;
      gap: 34px;
      border-top: 1px solid var(--line);
      padding: 30px 0;
    }

    .show-card:last-child {
      border-bottom: 1px solid var(--line);
    }

    .show-date {
      text-align: center;
      line-height: 1;
    }

    .show-month {
      display: block;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .show-day {
      display: block;
      font-size: 54px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .show-info {
      min-width: 0;
    }

    .show-venue {
      font-size: 24px;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .show-location {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      line-height: 1.3;
    }

    .show-action {
      min-width: 120px;
      text-align: center;
    }

    .ticket-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      height: 42px;
      padding: 0 20px;
      border: 1px solid var(--fg);
      border-radius: 999px;
      color: var(--fg);
      font-size: 13px;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .ticket-button:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 20px;
      font-style: italic;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    @media (max-width: 650px) {
      main {
        padding: 0 18px 90px;
      }
      .show-card {
        grid-template-columns: 80px minmax(0, 1fr) auto;
        gap: 18px;
        padding: 26px 0;
      }
      .show-month {
        font-size: 11px;
        margin-bottom: 6px;
      }
      .show-day {
        font-size: 40px;
      }
      .show-venue {
        font-size: 20px;
      }
      .show-location {
        font-size: 13px;
      }
      .show-action {
        min-width: 92px;
        text-align: right;
      }
      .ticket-button {
        min-width: 92px;
        height: 38px;
        padding: 0 12px;
        font-size: 11px;
      }
      .empty-state {
        padding: 60px 16px;
        font-size: 17px;
      }
    }

  </style>
</head>
<body>

  <header>
    <h1 class="site-title"><a href="index.html"><img class="logo-img" src="logo.png" alt="gone like summer"></a></h1>

    <nav aria-label="Main navigation">
      <a href="music.html">music</a>
      <a class="active" href="shows.html" aria-current="page">shows</a>
      <a href="about.html">about</a>
      <a href="videos.html">videos</a>
      <a href="panda.html">panda</a>
      <a href="https://wun6e0-uf.myshopify.com">shop</a>
    </nav>
  </header>

  <main>
    <section class="shows">
      <div class="show-tabs" aria-label="Show history navigation">
        <a class="show-tab active" href="shows.html">Upcoming</a>
        <span class="show-tab-divider">|</span>
        <a class="show-tab" href="past-shows.html">Past</a>
      </div>

      <div class="empty-state">
        No shows announced yet — check back soon.
      </div>
    </section>
  </main>

  <footer>
    © 2026 gone like summer
  </footer>

</body>
</html>
