<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gone like summer — You</title>

  <style>

    :root {
      --bg: #f7f5f0;
      --fg: #1a1a1a;
      --muted: #767267;
      --card-bg: #eae6dc;
      --line: #e2ddd0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 30px 50px;
      text-align: center;
    }

    .site-title {
      font-size: 44px;
      letter-spacing: 0.01em;
      margin: 0;
      font-weight: 400;
    }

    .site-subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-top: 10px;
      font-style: italic;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      font-size: 18px;
      line-height: 1;
      margin-top: 26px;
    }

    nav a {
      color: var(--fg);
      opacity: 0.55;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    footer {
      padding: 40px 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      border-top: 1px solid var(--line);
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      header {
        padding: 50px 20px 40px;
      }
      .site-title {
        font-size: 36px;
      }
      nav {
        gap: 24px;
        font-size: 16px;
      }
    }

    @media (max-width: 650px) {
      header {
        padding: 40px 18px 30px;
      }
      .site-title {
        font-size: 30px;
      }
      nav {
        gap: 16px;
        flex-wrap: wrap;
        font-size: 15px;
      }
    }


    main {
      padding: 0 30px 100px;
    }

    .hero {
      width: 100%;
      max-width: 620px;
      margin: 20px auto 0;
      text-align: center;
    }

    .hero-cover {
      width: 100%;
      max-width: 460px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      overflow: hidden;
      background: var(--card-bg);
    }

    .hero-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-title {
      font-size: 30px;
      margin-top: 28px;
      letter-spacing: 0.01em;
    }

    .album-sub {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      margin-top: 8px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 34px;
      margin-top: 46px;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-number {
      font-size: 56px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 74px;
    }

    .countdown-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .countdown-done {
      display: none;
      font-size: 24px;
      font-style: italic;
      margin-top: 46px;
    }

    .listen-link {
      display: inline-block;
      margin-top: 44px;
      font-size: 18px;
      letter-spacing: 0.03em;
      font-style: italic;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }

    .listen-link:hover {
      opacity: 0.6;
    }

    .listen-link.hidden {
      display: none;
    }

    @media (max-width: 650px) {
      main {
        padding: 0 18px 80px;
      }
      .album-title {
        font-size: 26px;
      }
      .countdown {
        gap: 18px;
        margin-top: 38px;
      }
      .countdown-number {
        font-size: 38px;
        min-width: 54px;
      }
      .countdown-label {
        font-size: 10px;
      }
    }

    @media (max-width: 450px) {
      .countdown {
        gap: 12px;
      }
      .countdown-number {
        font-size: 30px;
        min-width: 44px;
      }
    }

  </style>
</head>
<body>

  <header>
    <h1 class="site-title"><a href="index.html">gone like summer</a></h1>

    <nav aria-label="Main navigation">
      <a href="music.html">music</a>
      <a href="shows.html">shows</a>
      <a href="about.html">about</a>
      <a href="videos.html">videos</a>
      <a href="https://wun6e0-uf.myshopify.com" target="_blank" rel="noopener noreferrer">shop</a>
    </nav>
  </header>

  <main>
    <div class="hero">

      <div class="hero-cover">
        <img src="https://i.scdn.co/image/ab67616d0000b273ecccab25611df98f21fac3e3" alt="You">
      </div>

      <div class="album-title">"You"</div>
      <div class="album-sub">out Friday, October 2</div>

      <div class="countdown">
        <div class="countdown-unit">
          <span class="countdown-number" data-unit="days">00</span>
          <span class="countdown-label">days</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-number" data-unit="hours">00</span>
          <span class="countdown-label">hours</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-number" data-unit="minutes">00</span>
          <span class="countdown-label">minutes</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-number" data-unit="seconds">00</span>
          <span class="countdown-label">seconds</span>
        </div>
      </div>

      <div class="countdown-done">out now</div>

      <a class="listen-link presave-link" href="https://open.spotify.com/album/2xP6hSOvHqVHnyD3r8nicv?si=041add811d654d96" target="_blank" rel="noopener noreferrer">
        PRE-SAVE
      </a>

      <a class="listen-link release-link hidden" href="https://open.spotify.com/album/2xP6hSOvHqVHnyD3r8nicv" target="_blank" rel="noopener noreferrer">
        LISTEN
      </a>

    </div>
  </main>

  <footer>
    © 2026 gone like summer
  </footer>


  <script>
    // Friday, October 2, 2026, midnight — Eastern Time
    const RELEASE_DATE = new Date("2026-10-02T00:00:00-04:00");

    const numEls = {
      days: document.querySelector('[data-unit="days"]'),
      hours: document.querySelector('[data-unit="hours"]'),
      minutes: document.querySelector('[data-unit="minutes"]'),
      seconds: document.querySelector('[data-unit="seconds"]'),
    };

    const countdownEl = document.querySelector(".countdown");
    const doneEl = document.querySelector(".countdown-done");
    const presaveLink = document.querySelector(".presave-link");
    const releaseLink = document.querySelector(".release-link");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const now = new Date();
      const diff = RELEASE_DATE - now;

      if (diff <= 0) {
        countdownEl.style.display = "none";
        doneEl.style.display = "block";
        presaveLink.classList.add("hidden");
        releaseLink.classList.remove("hidden");
        clearInterval(timer);
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      numEls.days.textContent = pad(days);
      numEls.hours.textContent = pad(hours);
      numEls.minutes.textContent = pad(minutes);
      numEls.seconds.textContent = pad(seconds);
    }

    tick();
    const timer = setInterval(tick, 1000);
  </script>

</body>
</html>
