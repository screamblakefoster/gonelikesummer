    header {

    .site-title {

    nav a {

      opacity: 0.55;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    footer {
      padding: 40px 30px;

    }

    @media (max-width: 900px) {

        gap: 24px;
        font-size: 16px;
      }

    @media (max-width: 650px) {

      .logo-img {

        gap: 16px;
        flex-wrap: wrap;
        font-size: 15px;
      }

      header {
        padding-bottom: 14px;
      }

        margin-top: 0;
      }

    main {
      padding: 0 30px 100px;
    }

    .hero {
      width: 100%;

      background: var(--card-bg);

    .hero-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-title {
      font-size: 30px;
      margin-top: 28px;
      letter-spacing: 0.01em;
    }

    .album-sub {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      margin-top: 8px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 34px;
      margin-top: 0;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-number {
      font-size: 56px;
      line-height: 1;

      min-width: 74px;
    }

    .countdown-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .countdown-done {
      display: none;
      font-size: 24px;
      font-style: italic;
      margin-top: 0;
    }

    .listen-link {
      display: inline-block;
      margin-top: 44px;
      font-size: 18px;
      letter-spacing: 0.03em;
      font-style: italic;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }

    .listen-link:hover {
      opacity: 0.6;
    }

    .listen-link.hidden {
      display: none;
    }

    @media (max-width: 650px) {
      main {
        padding: 0 18px 80px;
      }
      .hero-cover {
        margin-top: 38px;

      .album-title {
        font-size: 26px;
      }

        gap: 18px;

      }
      .countdown-number {
        font-size: 38px;
        min-width: 54px;
      }

        font-size: 10px;
      }

      .countdown {
        gap: 12px;
      }
      .countdown-number {
        font-size: 30px;
        min-width: 44px;
      }

        </div>

          <span class="countdown-number" data-unit="hours">00</span>

        </div>
        <div class="countdown-unit">
          <span class="countdown-number" data-unit="minutes">00</span>

  <script>
    // Friday, October 2, 2026, midnight — Eastern Time
    const RELEASE_DATE = new Date("2026-10-02T00:00:00-04:00");

    const numEls = {
      days: document.querySelector('[data-unit="days"]'),
      hours: document.querySelector('[data-unit="hours"]'),
      minutes: document.querySelector('[data-unit="minutes"]'),
      seconds: document.querySelector('[data-unit="seconds"]'),
    };

    const countdownEl = document.querySelector(".countdown");
    const doneEl = document.querySelector(".countdown-done");
    const presaveLink = document.querySelector(".presave-link");
    const releaseLink = document.querySelector(".release-link");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const now = new Date();
      const diff = RELEASE_DATE - now;

      if (diff <= 0) {
        countdownEl.style.display = "none";
        doneEl.style.display = "block";
        presaveLink.classList.add("hidden");
        releaseLink.classList.remove("hidden");
        clearInterval(timer);
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      numEls.days.textContent = pad(days);
      numEls.hours.textContent = pad(hours);
      numEls.minutes.textContent = pad(minutes);
      numEls.seconds.textContent = pad(seconds);
    }

    tick();
    const timer = setInterval(tick, 1000);
  </script>
